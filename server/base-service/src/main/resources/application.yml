server:
  port: 8080

spring:
  application:
    name: base-service
  profiles:
    active: dev
  cache:
    type: redis
  data:
    # Redis 配置：Spring Cache 与 Redisson 共用此配置
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 5000
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:/}
    listener:
      simple:
        acknowledge-mode: auto
        # 消费失败时不重新入队，避免异常消息无限循环消费
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms
          multiplier: 2
          max-interval: 10000ms
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/campusmart?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=GMT%2b8}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    druid:
      initial-size: 10
      min-idle: 10
      # 压测时适当增加连接数
      max-active: 50
      max-wait: 60000
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      # 开启 SQL 监控和防注入过滤器
      filters: stat,wall
      # 压测时关闭慢 SQL 日志，避免日志被打爆
      connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=1000
      stat:
        log-slow-sql: false
        slow-sql-millis: 1000
      wall:
        config:
          multi-statement-allow: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

mybatis-plus:
  # 压测时 MyBatis 不打印 SQL（不配置 log-impl 即使用默认无输出）
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

aliyun:
  oss:
    endpoint: ${ALIYUN_OSS_ENDPOINT:}
    access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:}
    bucket-name: ${ALIYUN_OSS_BUCKET_NAME:}
  sms:
    access-key-id: ${ALIYUN_SMS_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_SMS_ACCESS_KEY_SECRET:}
    sign-name: ${ALIYUN_SMS_SIGN_NAME:}
    template-code: ${ALIYUN_SMS_TEMPLATE_CODE:}

alipay:
  app-id: ${ALIPAY_APP_ID:your_app_id}
  private-key: ${ALIPAY_PRIVATE_KEY:your_private_key}
  public-key: ${ALIPAY_PUBLIC_KEY:your_public_key}
  server-url: https://openapi-sandbox.dl.alipaydev.com/gateway.do
  notify-url: ${ALIPAY_NOTIFY_URL:http://localhost:8080/app/payments/alipay/notify}
  return-url: ${ALIPAY_RETURN_URL:}

# 压测时只保留 OrderTimeoutListener 的错误日志
logging:
  level:
    org.example.CampusMart.web.listener.OrderTimeoutListener: WARN
